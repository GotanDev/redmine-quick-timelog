  redmine_quick_timelog_timer_notify_long_body: "Diese Stoppuhr läuft seit über %{hours} Stunden ununterbrochen."
  redmine_quick_timelog_timer_notify_time_title: Geplante Erinnerung
  redmine_quick_timelog_timer_notify_time_body: "Es ist nach %{time} Uhr und die Stoppuhr läuft noch."
