  redmine_quick_timelog_setting_working_days: Arbeitstage
  redmine_quick_timelog_setting_working_days_hint: Wird für die untenstehende Hervorhebung fehlender Einträge verwendet; ein einfacher Wochenkalender, keine Feiertage.
  redmine_quick_timelog_setting_highlight_missing_days: Arbeitstage ohne jeglichen Eintrag orange hervorheben
