  redmine_quick_timelog_setting_timer_notify_times_hint: "Zeigt eine Benachrichtigung, sobald die Uhrzeit erreicht ist und die Stoppuhr noch läuft. Mehrere Uhrzeiten durch Komma getrennt, z. B. 12:30, 18:00."

  redmine_quick_timelog_weekly_target_title: Typische Woche
  redmine_quick_timelog_weekly_target_hint: Erwartete Stunden pro Wochentag. Ein leer gelassener Tag wird nie hervorgehoben. Bestimmt die Farben im Verlauf der Schnellerfassung.
  redmine_quick_timelog_weekly_target_saved: Gespeichert.
  redmine_quick_timelog_weekly_target_error: Speichern nicht möglich.

