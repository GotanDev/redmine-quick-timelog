  redmine_quick_timelog_setting_timer_notify_hours: Benachrichtigen nach (Stunden am Stück)
  redmine_quick_timelog_setting_timer_notify_hours_hint: Zeigt eine Browser-Benachrichtigung, wenn die Stoppuhr ununterbrochen länger als diese Dauer läuft. Leer lassen oder 0 zum Deaktivieren.
