  redmine_quick_timelog_setting_timer_notify_times_hint: "Muestra una notificación en cuanto se supera la hora y el cronómetro sigue en marcha. Varias horas separadas por una coma, p. ej. 12:30, 18:00."

  redmine_quick_timelog_weekly_target_title: Semana tipo
