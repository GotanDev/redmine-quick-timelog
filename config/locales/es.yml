  redmine_quick_timelog_setting_highlight_missing_days: Resaltar en naranja los días laborables sin ningún registro
  redmine_quick_timelog_setting_highlight_missing_days_hint: No tiene efecto en un día cubierto por una semana tipo personal (ver "Mi cuenta"); esta tiene prioridad.
