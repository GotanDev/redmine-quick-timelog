  redmine_quick_timelog_wand_hint: "Ranges \"9h > 12h30\", durations \"1h30\" or \"45m\", breaks \"-30m\". Separate with a comma."

  redmine_quick_timelog_settings_title: Quick time logging
  redmine_quick_timelog_setting_show_on_welcome: Show the form on the welcome page
  redmine_quick_timelog_setting_show_on_welcome_hint: Adds the quick-logging block to the right column of Redmine's home page.
  redmine_quick_timelog_setting_inline_parse: Parse time ranges typed directly into the "Hours" field
  redmine_quick_timelog_setting_inline_parse_hint: "Typing \"9h > 12h30\" into the Hours field converts it to a duration as soon as the field loses focus."
  redmine_quick_timelog_setting_wand_everywhere: Add the magic wand to every time-entry form
  redmine_quick_timelog_setting_wand_everywhere_hint: Uncheck to limit it to this plugin's own quick-entry form.
  redmine_quick_timelog_setting_default_activity: Default activity
  redmine_quick_timelog_setting_recent_days: History (days before today)
  redmine_quick_timelog_setting_comment_required: Require a comment in the quick-entry form
  redmine_quick_timelog_setting_working_days: Working days
  redmine_quick_timelog_setting_working_days_hint: Used for the "no entry" highlight below; a plain weekly calendar, not public holidays.
  redmine_quick_timelog_setting_highlight_missing_days: Highlight working days with no entry at all in orange
  redmine_quick_timelog_setting_highlight_missing_days_hint: Has no effect on a day covered by a personal typical week (see "My account"); that one takes priority.
  redmine_quick_timelog_setting_timer_notify_hours: Notify after (consecutive hours)
  redmine_quick_timelog_setting_timer_notify_hours_hint: Shows a browser notification if the timer has been running without interruption past this duration. Leave blank or 0 to disable.
  redmine_quick_timelog_setting_timer_notify_times: Check-in times
  redmine_quick_timelog_setting_timer_notify_times_hint: "Shows a notification as soon as the time has passed and the timer is still running. Several times separated by a comma, e.g. 12:30, 18:00."

  redmine_quick_timelog_weekly_target_title: Typical week
  redmine_quick_timelog_weekly_target_hint: Expected hours per weekday. A day left blank is never highlighted. Feeds the colours of the quick-log history.
  redmine_quick_timelog_weekly_target_saved: Saved.
  redmine_quick_timelog_weekly_target_error: Could not save.

